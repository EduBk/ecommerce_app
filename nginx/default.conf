server {
    listen 80;
    server_name localhost;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Directiva root para archivos estáticos
    root /srv/www/static;

    # Configuración para Next.js (client)
    location / {
        proxy_pass http://client:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Aplicar límite de tasa
        limit_req zone=one burst=5;
    }

    # Configuración para contenido estático de Next.js
    location /_next/static {
        proxy_pass http://client:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Agregar cabeceras de caché para contenido estático
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Configuración para archivos estáticos adicionales
    location /static/ {
        alias /srv/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Configuración para el backend API
    location /api/v1 {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aplicar límite de tasa
        limit_req zone=one burst=5;
    }

    # Fallback para archivos que no se encuentran
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.          { access_log off; log_not_found off; deny all; }
}

